name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release number (e.g., 0.2.0). The builds get 0.2.0.0 (Jellyfin 10.10), 0.2.0.1 (10.11), 0.2.0.2 (12)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One SDK per Jellyfin generation: 10.10 builds on .NET 8, 10.11 on .NET 9, 12 on .NET 10.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # The release number is the first three digits; the fourth one is added per Jellyfin generation.
          if [[ "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "Tag '$TAG' does not look like X.Y.Z"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release $VERSION (tag $TAG)"

      # Runs the unit tests, builds the plugin for every supported Jellyfin generation,
      # packs one zip each (the plugin dll only) and adds them to manifest.json.
      - name: Test, build and update the manifest
        shell: pwsh
        run: >
          ./build.ps1
          -ReleaseVersion "${{ steps.version.outputs.version }}"
          -UpdateManifest
          -DownloadBaseUrl "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: syncvote-plugin
          path: artifacts/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SyncVote v${{ steps.version.outputs.version }}
          files: artifacts/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest for v${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push origin HEAD:main || git push origin HEAD:master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
